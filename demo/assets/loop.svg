<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="Hiragino Sans, Avenir Next, sans-serif">
  <defs>
    <marker id="ah-dark" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9 Z" fill="#141413"/>
    </marker>
    <marker id="ah-clay" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9 Z" fill="#D97757"/>
    </marker>
  </defs>

  <!-- left box: LP (the proposal's engine) -->
  <text x="280" y="106" font-size="22" font-weight="bold" fill="#D97757" text-anchor="middle" letter-spacing="2">速い・ほぼ正しい</text>
  <rect x="80" y="126" width="400" height="212" rx="16" fill="#FBEEE8" stroke="#D97757" stroke-width="3"/>
  <text x="280" y="196" font-size="32" font-weight="bold" fill="#141413" text-anchor="middle">線形最適化（LP）</text>
  <text x="280" y="240" font-size="22" fill="#5A5852" text-anchor="middle">感度行列 S で全ノードを一括最適化</text>
  <text x="280" y="296" font-size="26" font-weight="bold" fill="#D97757" text-anchor="middle">求解 &lt; 1 秒</text>

  <!-- right box: AC power flow (the referee) -->
  <text x="920" y="106" font-size="22" font-weight="bold" fill="#5A5852" text-anchor="middle" letter-spacing="2">遅い・正確</text>
  <rect x="720" y="126" width="400" height="212" rx="16" fill="#FFFFFF" stroke="#141413" stroke-width="2.5"/>
  <text x="920" y="196" font-size="32" font-weight="bold" fill="#141413" text-anchor="middle">AC 潮流計算</text>
  <text x="920" y="240" font-size="22" fill="#5A5852" text-anchor="middle">真の電圧・電流で制約を検証</text>
  <text x="920" y="296" font-size="26" font-weight="bold" fill="#5A5852" text-anchor="middle">1 回 数秒</text>

  <!-- top arrow: LP -> AC -->
  <line x1="486" y1="190" x2="708" y2="190" stroke="#141413" stroke-width="3" marker-end="url(#ah-dark)"/>
  <text x="600" y="172" font-size="22" font-weight="bold" fill="#141413" text-anchor="middle">候補解 p*</text>

  <!-- bottom arrow: AC -> LP (re-linearize) -->
  <line x1="714" y1="282" x2="492" y2="282" stroke="#D97757" stroke-width="3" marker-end="url(#ah-clay)"/>
  <text x="600" y="372" font-size="20" fill="#5A5852" text-anchor="middle">違反があれば運転点を更新して再線形化</text>

  <!-- convergence badge -->
  <rect x="498" y="408" width="204" height="58" rx="29" fill="#141413"/>
  <text x="600" y="446" font-size="25" font-weight="bold" fill="#FAF9F5" text-anchor="middle">平均 3 往復</text>
</svg>
