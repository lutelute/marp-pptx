<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>marp-pptx: Slide Types</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/types.css') }}">
</head>
<body>
<div class="container">
<h1>型一覧 ({{ types|length }})</h1>
<div class="tabs">
<a href="/">変換</a>
<a href="/types-page" class="active">型一覧</a>
</div>
<table>
<thead><tr><th>型</th><th>カテゴリ</th><th>図形</th><th>意味</th><th>使いどころ</th></tr></thead>
<tbody>
{% for t in types %}
<tr>
<td><code>{{ t.name }}</code></td>
<td><span class="cat-badge">{{ categories[t.category] }}</span></td>
<td>{{ t.geometry }}</td>
<td>{{ t.meaning }}</td>
<td>{{ t.use_when }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
</body>
</html>
